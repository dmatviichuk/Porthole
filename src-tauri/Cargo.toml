[package]
name = "porthole"
version = "1.0.0"
description = "Desktop client for Kubernetes"
authors = ["Dmytro Matviichuk"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "porthole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
kube = { version = "4.2.0", default-features = false, features = [
    "client",
    "config",
    "runtime",
    "ws",
    "gzip",
    "rustls-tls",
    "ring",
] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "process"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde-saphyr = "1.3.0"
tauri-plugin-window-state = "2.5.0"

# `pnpm app` runs a debug build. Optimizing the dependencies (built once, then cached) keeps
# kube and serde about as fast as in a release while our own crate still rebuilds in seconds.
[profile.dev.package."*"]
opt-level = 2

# `pnpm build:release` and the release workflow: smallest, fastest binary, slow to compile.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# `pnpm build:dev`: optimized enough to feel like the release, quick to rebuild.
# Its own profile, so it never invalidates the release build's artifacts.
[profile.fast]
inherits = "release"
codegen-units = 256
lto = false
incremental = true
strip = false
