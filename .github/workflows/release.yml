name: Release

# Release the version in Cargo.toml: from the Actions tab ("Run workflow" on `main`),
# or by pushing a matching tag (e.g. v2.0.0). One draft release is created up front, every
# platform uploads into it, and it is published only when all builds succeeded.
#
# Caches: GitHub shares caches from the default branch with every later run, but never shares
# what a tag-triggered run saves. Runs started from `main` therefore save the build
# caches the next release starts from; tag runs restore them but cannot save.
# "Run workflow" with `publish` off builds every platform without releasing, which also
# warms the caches after a dependency update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (off builds every platform without releasing)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  draft:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            notes=$(cat <<'NOTES'
          Downloads:
          - macOS: `.dmg` (`aarch64` for Apple silicon, `x64` for Intel)
          - Windows: `.msi` or `-setup.exe`
          - Linux: `.AppImage`, `.deb` or `.rpm`

          The builds are not code-signed yet. On macOS, after copying the app to Applications, run
          `xattr -dr com.apple.quarantine /Applications/Porthole.app` once.
          NOTES
            )
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f name="Porthole $tag" -f target_commitish="$GITHUB_SHA" \
              -f body="$notes" -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # Plain apt here, not a cache action: this job holds a token that can publish releases,
      # so it runs no third-party code beyond the build itself. CI caches these packages.
      - name: Install Linux native and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libx11-dev libxcb1-dev libgl1-mesa-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo install cargo-packager --version 0.11.8 --locked
      - run: cargo xtask package --profile release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: porthole-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
          if-no-files-found: error
      - name: Upload release installers
        if: needs.draft.outputs.release-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          find "target/${{ matrix.target }}/release/bundle" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 | xargs -0 gh release upload "v$VERSION" --clobber

  publish:
    needs: [draft, build]
    if: needs.draft.outputs.release-id != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq .html_url
