[workspace]
resolver = "3"
members = ["apps/porthole", "crates/kubernetes", "xtask"]
default-members = ["apps/porthole"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
authors = ["Dmytro Matviichuk"]
repository = "https://github.com/dmatviichuk/Porthole"

[workspace.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "persistence", "accesskit", "x11", "wayland"] }
egui_extras = { version = "0.36.2", features = ["svg"] }
font-kit = "0.14"
ttf-parser = "0.25.1"
arboard = { version = "3.6.1", default-features = false }
raw-window-handle = "0.6"
rusqlite = { version = "0.38", features = ["bundled"] }
vt100 = "0.16.2"
chrono = "0.4"
regex = "1"
fancy-regex = "0.19.2"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
kube = { version = "4.2.0", default-features = false, features = [
    "client",
    "config",
    "runtime",
    "ws",
    "gzip",
    "rustls-tls",
    "ring",
] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "process"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde-saphyr = "1.3.0"


porthole-kubernetes = { path = "crates/kubernetes" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.fast]
inherits = "release"
codegen-units = 256
lto = false
incremental = true
strip = false
