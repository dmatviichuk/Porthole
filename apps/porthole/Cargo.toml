[package]
name = "porthole"
description = "Desktop client for Kubernetes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "porthole_lib"

[dependencies]
porthole-kubernetes.workspace = true
eframe.workspace = true
egui_extras.workspace = true
font-kit.workspace = true
ttf-parser.workspace = true
arboard.workspace = true
raw-window-handle.workspace = true
rusqlite.workspace = true
vt100.workspace = true
chrono.workspace = true
regex.workspace = true
fancy-regex.workspace = true
directories.workspace = true
image.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
k8s-openapi.workspace = true
kube.workspace = true

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.1", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "NSColorSpace", "NSResponder"] }
